name: Проверка на пътуванията

on:
  schedule:
    - cron: "30 5 * * *"      # 08:30 лятно / 07:30 зимно българско време
    - cron: "30 15 * * *"     # 18:30 лятно / 17:30 зимно – втора проверка, за да не изпуснеш място
  workflow_dispatch:           # ръчно пускане от таба Actions
  push:
    branches: [main]
    paths: [travels.yaml]      # добавиш ли пътуване – проверява веднага

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    # По подразбиране върви в облака на GitHub. Ако сайтът блокира адресите
    # на GitHub, създай променлива RUNNER = self-hosted
    # (Settings → Secrets and variables → Actions → Variables) и
    # проверката ще върви от твоя компютър. Виж README.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Инсталиране
        run: uv sync --frozen --no-dev

      - name: Проверка на пътуванията
        run: uv run python -m tracker
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

      - name: HTML на непрочетените страници
        if: ${{ !cancelled() && hashFiles('debug/*.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: debug-html
          path: debug/
          retention-days: 7

      - name: Запис на базата
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/travels.db data/summary.json
          if git diff --cached --quiet; then
            echo "Няма промени в базата."
            exit 0
          fi
          git commit -m "Проверка: $(TZ=Europe/Sofia date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push

  # Push от GITHUB_TOKEN не стартира други workflow-и, затова сайтът
  # се публикува директно оттук.
  pages:
    needs: check
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
