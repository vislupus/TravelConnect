name: Публикуване на сайта

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # последният commit в main – включително току-що записаните данни
          ref: ${{ github.event.repository.default_branch }}

      - name: Сглобяване на сайта
        run: |
          mkdir -p _site/data
          cp -r docs/. _site/
          if [ -f data/summary.json ]; then cp data/summary.json _site/data/summary.json; fi

      - uses: actions/configure-pages@v6

      # Името включва номера на опита: при „Re-run“ старият артефакт остава
      # в същия run и с едно и също име публикуването отказва
      # („Multiple artifacts named github-pages“).
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # Понякога GitHub още не „вижда“ току-що качения артефакт
      # („No artifacts named … were found“) – втори опит след малко.
      - name: Изчакване преди втори опит
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
